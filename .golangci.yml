version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - unconvert
    - usestdlibvars
    - wastedassign
  settings:
    errcheck:
      # Closing something we are done with has no useful error to handle,
      # and the bench reports write to stdout.
      exclude-functions:
        - (io.Closer).Close
        - fmt.Fprintf
        - fmt.Fprintln
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ksamirdev/itchbook
